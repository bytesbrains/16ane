[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "16ane-sdk"
version = "0.1.0"
description = "Python SDK for the 16ane Agent Economy (tANE Sandbox)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://16ane.com"
Source = "https://github.com/bytesbrains/16ane/tree/main/packages/sdk-py"
Issues = "https://github.com/bytesbrains/16ane/issues"
Security = "https://github.com/bytesbrains/16ane/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["ane_sdk*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Correctness (pyflakes, pycodestyle errors, bugbear) and import order; style modernisation is not enforced.
select = ["E", "F", "W", "B", "I"]
# EIP-712 type strings stay on one line so they can be diffed against the Solidity typehashes.
ignore = ["E501"]
