name: CI

on:
  # PR commits are covered by pull_request; push only runs for main so each commit runs CI once.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Foundry, SDK & E2E Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dev dependencies (TypeScript type-checker)
        run: npm ci --ignore-scripts

      - name: Install Python lint and packaging tools
        run: |
          python3 -m venv "${RUNNER_TEMP}/pytools"
          "${RUNNER_TEMP}/pytools/bin/pip" install --disable-pip-version-check ruff==0.16.10 build==1.6.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Show tool versions
        run: |
          forge --version
          node --version
          python3 --version

      - name: Run Forge fmt check
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge unit, fuzz, and invariant tests
        run: forge test -vvv

      - name: Simulate Sandbox deployment script (dry-run)
        env:
          PRIVATE_KEY: '1'
        run: forge script script/DeploySandbox.s.sol:DeploySandbox --chain-id 84532

      - name: Type-check TypeScript (SDK, CLI, server, E2E)
        run: npm run typecheck

      - name: Lint Python SDK
        run: '"${RUNNER_TEMP}/pytools/bin/ruff" check packages/sdk-py'

      - name: Build Python SDK sdist and wheel
        run: '"${RUNNER_TEMP}/pytools/bin/python" -m build --sdist --wheel --outdir "${RUNNER_TEMP}/dist" packages/sdk-py'

      - name: Run TypeScript SDK unit tests
        run: npm run test:sdk-ts

      - name: Run CLI unit tests
        run: npm run test:cli

      - name: Run sandbox server unit tests
        run: npm run test:server

      - name: Run facilitator unit tests
        run: npm run test:facilitator

      - name: Run indexer unit tests
        run: npm run test:indexer

      - name: Run repo script unit tests
        run: npm run test:scripts

      - name: Run Python SDK unit tests
        run: npm run test:sdk-py

  coverage:
    name: Coverage report and thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0 # the full history, so the report can diff against the PR base

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dev dependencies (TypeScript type-checker)
        run: npm ci --ignore-scripts

      - name: Install Python lint, packaging and coverage tools
        run: |
          python3 -m venv "${RUNNER_TEMP}/pytools"
          "${RUNNER_TEMP}/pytools/bin/pip" install --disable-pip-version-check ruff==0.16.10 build==1.6.1 coverage==7.16.2

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Collect Solidity coverage
        run: |
          mkdir -p coverage
          npm run coverage:contracts

      - name: Collect TypeScript SDK coverage
        run: npm run coverage:sdk-ts

      - name: Collect CLI coverage
        run: npm run coverage:cli

      - name: Collect sandbox server coverage
        run: npm run coverage:server

      - name: Collect facilitator coverage
        run: npm run coverage:facilitator

      - name: Collect indexer coverage
        run: npm run coverage:indexer

      - name: Collect repo script coverage
        run: npm run coverage:scripts

      # The venv's python shadows the system one so `python3 -m coverage` finds coverage.py.
      - name: Collect Python SDK coverage
        run: |
          export PATH="${RUNNER_TEMP}/pytools/bin:${PATH}"
          npm run coverage:sdk-py

      - name: Collect E2E coverage
        run: npm run coverage:e2e

      - name: Diff against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff -U0 "${BASE_SHA}..HEAD" > coverage/base.diff

      # The report is written to the run summary (readable on fork PRs too, with no extra
      # permissions) before thresholds are checked, so a red run still shows its numbers.
      - name: Write the coverage report and check thresholds
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npm run coverage:report -- --diff coverage/base.diff
          else
            npm run coverage:report
          fi

      - name: Upload coverage files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/*.lcov
            coverage/base.diff
          if-no-files-found: warn
          retention-days: 14

  slither:
    name: Slither static analysis (medium+)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install Slither
        run: |
          python3 -m venv "${RUNNER_TEMP}/slither"
          "${RUNNER_TEMP}/slither/bin/pip" install --disable-pip-version-check slither-analyzer==0.11.6

      # Reviewed false positives are suppressed inline with `slither-disable-next-line` and a reason.
      - name: Run Slither on src/
        run: '"${RUNNER_TEMP}/slither/bin/slither" . --filter-paths "lib/|test/|script/" --exclude-informational --exclude-low --fail-medium'

  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The release binary, checked against a pinned SHA-256, rather than gitleaks-action,
      # which needs a license key for organization repositories.
      - name: Install Gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Check the allowlist still catches private keys
        run: ./test/gitleaks/allowlist.test.sh

      # Pull requests scan their own commits; pushes to main and manual runs scan full history.
      - name: Scan commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "${BASE_SHA}" ]]; then
            gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="${BASE_SHA}..HEAD" .
          else
            gitleaks git --no-banner --redact --config .gitleaks.toml .
          fi

  docker:
    name: Sandbox server Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      # The image Fly.io and self-hosters run (ADR-0016, #74); amd64 on the runner, like Fly.io.
      - name: Build image
        run: docker build -t 16ane-sandbox:test .

      - name: Run the image against a local chain (healthz, gasless claim, cooldown, x402 quote, clean stop)
        run: scripts/docker-smoke.sh 16ane-sandbox:test

      # The standalone facilitator and indexer images self-hosters run (REQ-106, #18).
      - name: Build standalone images
        run: |
          docker build -f services/facilitator/Dockerfile -t 16ane-facilitator:test .
          docker build -f services/indexer/Dockerfile -t 16ane-indexer:test .

      - name: Run the standalone images against a local chain (verify/settle both schemes, anchor indexing, clean stop)
        run: scripts/docker-smoke-standalone.sh 16ane-facilitator:test 16ane-indexer:test

  committed-files:
    name: Committed files hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify no local state, ignored, unexpected binary or oversized files in PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-committed-files.sh "${BASE_SHA}..HEAD"
