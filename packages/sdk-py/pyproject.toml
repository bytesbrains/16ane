[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ane-sdk"
version = "0.1.0"
description = "Python SDK for the 16ane Agent Economy (tANE Sandbox)"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ane_sdk*"]
