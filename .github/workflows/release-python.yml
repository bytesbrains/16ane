name: Release Python SDK

# Publishes packages/sdk-py to PyPI as `16ane-sdk` when a `v<version>` tag is pushed (CONTRIBUTING.md,
# "Versions and releases"). Uses PyPI Trusted Publishing: PyPI accepts this workflow's short-lived OIDC
# credential for the `pypi` environment, so no PyPI token is stored in GitHub.
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A tag can point at any commit; only release what has been merged to main.
      - name: Check the tag is on main and matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${TAG} is not on main"; exit 1; }
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/sdk-py/pyproject.toml", "rb"))["project"]["version"])')
          [[ "${TAG}" == "v${version}" ]] \
            || { echo "::error::tag ${TAG} does not match packages/sdk-py version ${version}"; exit 1; }

      - name: Build
        run: |
          python3 -m venv "${RUNNER_TEMP}/pytools"
          "${RUNNER_TEMP}/pytools/bin/pip" install --disable-pip-version-check build==1.6.1 twine==6.1.0
          "${RUNNER_TEMP}/pytools/bin/python" -m build --sdist --wheel --outdir dist packages/sdk-py
          "${RUNNER_TEMP}/pytools/bin/twine" check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must match the environment named in the PyPI trusted publisher for 16ane-sdk.
    environment:
      name: pypi
      url: https://pypi.org/project/16ane-sdk/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
