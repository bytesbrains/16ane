openapi: 3.1.0
info:
  title: 16ane Agent Economy Sandbox API
  version: 0.1.0
  description: >
    OpenAPI v1 specification for the 16ane Agent Economy Public Sandbox.
    All settlements use simulated tANE ("TEST TOKENS (tANE) - NO CASH VALUE").
    1 INR = 16 Annas (1 Anna = 1/16 Rupee = 6.25 paise).
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:8787
    description: Local Anvil + Reference Sandbox Server
paths:
  /.well-known/16ane-service.json:
    get:
      summary: Fetch EIP-712 signed ServiceManifest (16ane-manifest-v0)
      operationId: getServiceManifest
      responses:
        "200":
          description: Signed ServiceManifest
  /v1/networks:
    get:
      summary: List supported sandbox networks and AneRegistry addresses
      operationId: listNetworks
      responses:
        "200":
          description: Network list
  /v1/assets:
    get:
      summary: List tANE sandbox token metadata and explicit no-cash-value notice
      operationId: listAssets
      responses:
        "200":
          description: Asset metadata
  /v1/relay:
    post:
      summary: Submit an owner-signed action; the relayer pays the gas, so the owner never needs ETH (#77)
      description: >-
        One of four actions: `transfer` (EIP-3009 transferWithAuthorization of tANE; funding a vault is a
        transfer to it), `createVault` (EIP-712 CreateVault(owner,salt,deadline), domain "16ane Relay" bound to the
        factory), `setPolicy` (AneAgentVault.setPolicyWithSig) and `revoke` (revokeWithSig). The SDK's
        OwnerWallet.signTransfer / signVaultCreation / signPolicy / signRevoke produce the fields. Shape, deadline
        (30 s to 1 h ahead), signer, target (the tANE token, the factory, or a vault it created), the gas-price
        ceiling and a simulation from the relayer's address are all checked before anything is sent, so a refused
        request costs no gas. The relayer's daily gas budget is the only limit.
      operationId: relaySignedAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, signature]
              properties:
                action:
                  type: string
                  enum: [transfer, createVault, setPolicy, revoke]
                signature:
                  type: string
                  description: 65-byte signature by the token holder (transfer) or vault owner
      responses:
        "201":
          description: Sent and mined; returns txHash, blockNumber and, for createVault, vaultAddress
        "400":
          description: Unknown action or malformed field (ANE-E-1201)
        "403":
          description: Wrong signer, deadline out of range, or a target the relayer won't call (ANE-E-1202)
        "409":
          description: The same signed action is already being relayed (ANE-E-1203)
        "422":
          description: The simulation reverts, so nothing was sent (ANE-E-1204)
        "503":
          description: Gas price above the relayer's ceiling (ANE-E-1205) or today's gas budget used up (ANE-E-1006)
  /v1/faucet/claims:
    post:
      summary: Claim simulated tANE from the gasless sandbox faucet (max 16,000 tANE per recipient per hour)
      description: >-
        Each claim carries a proof (#79): an `authorization` signed by the recipient (EIP-712 `FaucetClaim`, as
        checked by AneFaucet.relayedClaim; see AneClient.signFaucetClaim) or, where the server has Turnstile set
        up, a `turnstileToken` from the web faucet. A refused claim costs the relayer no gas.
      operationId: createFaucetClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient:
                  type: string
                amount:
                  type: string
                authorization:
                  type: object
                  required: [deadline, nonce, signature]
                  properties:
                    deadline:
                      type: integer
                      description: Unix seconds, 30 s to 1 h from now
                    nonce:
                      type: string
                      description: Random bytes32; single use, enforced on-chain
                    signature:
                      type: string
                      description: 65-byte signature by the recipient over the EIP-712 FaucetClaim
                turnstileToken:
                  type: string
      responses:
        "201":
          description: Claim settled on-chain
        "401":
          description: No proof (ANE-E-1007)
        "403":
          description: Proof refused - wrong signer, bad deadline, used nonce or failed Turnstile check (ANE-E-1008)
        "409":
          description: A claim for this recipient is already in progress (ANE-E-1009)
        "429":
          description: Cooldown or quota active
        "503":
          description: Relayer gas budget used up (ANE-E-1006) or Turnstile unavailable (ANE-E-1010)
  /v1/faucet/claims/{id}:
    get:
      summary: Get faucet claim status by claimId
      operationId: getFaucetClaim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claim status record
        "404":
          description: Claim not found
  /v1/wallets/{address}/balances:
    get:
      summary: Get tANE balance and AneAgentVault accounting summary
      operationId: getWalletBalances
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Balance and accounting breakdown
  /v1/payments/{id}:
    get:
      summary: Get verified payment receipt by txHash or intentId
      operationId: getPaymentReceipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified x402 v2 receipt
        "404":
          description: Receipt not found
  /v1/x402/supported:
    get:
      summary: List supported x402 v2 payment schemes and assets
      operationId: getSupportedX402Schemes
      responses:
        "200":
          description: Supported schemes (ane-vault-v1, exact)
  /v1/services:
    get:
      summary: List registered service manifests
      operationId: listServices
      responses:
        "200":
          description: Registered services
    post:
      summary: Verify and publish a signed 16ane-manifest-v0 ServiceManifest
      operationId: publishService
      responses:
        "201":
          description: Service manifest verified and indexed
        "400":
          description: Invalid manifest signature
  /v1/campaigns:
    get:
      summary: List provider-sponsored trial campaigns with quotas, spend and live status
      description: >-
        Each campaign carries its caps (maxCallsPerWallet, maxCallsGlobalPerDay,
        maxTokensPerRequest, providerCostBudgetMicros), lifetime spend, today's calls, window
        (startsAt/expiresAt), eligibility, stored and effective status, trial-only endpoints and
        the sponsor disclosure. Quotas bind only sponsored cost: past them a call falls back to
        the endpoint's normal paid 402 quote, unless the endpoint is trial-only.
      operationId: listCampaigns
      responses:
        "200":
          description: Sponsored trial campaigns
  /v1/campaigns/{id}/pause:
    post:
      summary: Pause a campaign's sponsorship now; paid calls are unaffected
      description: >-
        The provider's circuit breaker. The body carries a deadline (unix seconds, within the
        next hour) and the provider's EIP-191 signature over the campaign control message
        (`16ane campaign control`, provider, campaign, action, deadline); only the campaign
        provider's key is accepted. A restart never unpauses a campaign.
      operationId: pauseCampaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deadline, signature]
              properties:
                deadline:
                  type: integer
                signature:
                  type: string
      responses:
        "200":
          description: Campaign paused (or already paused)
        "403":
          description: Not signed by the campaign provider, or the deadline is out of range (ANE-E-1302)
        "404":
          description: Unknown campaign (ANE-E-1301)
  /v1/campaigns/{id}/resume:
    post:
      summary: Resume a paused campaign
      description: >-
        Same authorization as pause. Refused with 409 while the sponsor budget is still spent
        or the campaign window has passed.
      operationId: resumeCampaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deadline, signature]
              properties:
                deadline:
                  type: integer
                signature:
                  type: string
      responses:
        "200":
          description: Campaign resumed
        "403":
          description: Not signed by the campaign provider (ANE-E-1302)
        "404":
          description: Unknown campaign (ANE-E-1301)
        "409":
          description: Budget still spent or window passed (ANE-E-1303)
  /v1/demo/summarize:
    post:
      summary: Deterministic text summarization (16 tANE via x402 v2, or 1 free sponsored trial call)
      operationId: demoSummarize
      responses:
        "200":
          description: Summary result with PAYMENT-RESPONSE receipt header
        "402":
          description: Payment Required with PAYMENT-REQUIRED base64 quote header
        "409":
          description: Idempotency-Key conflict or replay rejected
        "429":
          description: Trial-only endpoint whose sponsored quota is spent (ANE-E-1304)
        "503":
          description: Trial-only endpoint whose sponsor budget is spent (ANE-E-1305)
  /v1/demo/clean-data:
    post:
      summary: Deterministic JSON array deduplication and normalization (32 tANE via x402 v2)
      operationId: demoCleanData
      responses:
        "200":
          description: Cleaned data with PAYMENT-RESPONSE receipt header
        "402":
          description: Payment Required
  /v1/demo/simulate-failure:
    post:
      summary: Settles 16 tANE then simulates downstream failure and executes on-chain refundPayment
      operationId: demoSimulateFailure
      responses:
        "402":
          description: Payment Required
        "502":
          description: Downstream failure with automatic on-chain refundTxHash
