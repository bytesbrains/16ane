[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned so AneRegistry's CREATE2 bytecode does not drift with the host's default solc.
solc_version = "0.8.28"
# Strip the source metadata hash so comment/formatting edits never shift the CREATE2 address.
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]
