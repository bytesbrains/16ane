name: Dashboard

# Checks the owner/provider dashboard (app.16ane.com, issue #17): static unit
# tests, the hermetic Playwright smoke/a11y specs, the Tier-1 stub-wallet specs
# on Anvil, and the Tier-2 real-MetaMask journey (Synpress, headed Chromium
# under xvfb). Deploys are done by Cloudflare Workers Builds, not here, so this
# workflow holds no Cloudflare credentials.
on:
  push:
    branches: [main]
    paths: ['dashboard/**', 'test/dashboard/**', 'playwright*.config.ts', 'scripts/dashboard-env.cjs', 'wrangler.dashboard.jsonc', 'services/sandbox-server/**', 'e2e/harness.ts', 'packages/sdk-ts/**', 'package.json', 'package-lock.json', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['dashboard/**', 'test/dashboard/**', 'playwright*.config.ts', 'scripts/dashboard-env.cjs', 'wrangler.dashboard.jsonc', 'services/sandbox-server/**', 'e2e/harness.ts', 'packages/sdk-ts/**', 'package.json', 'package-lock.json', '.github/workflows/dashboard.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Dashboard static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run dashboard unit tests
        run: npm run test:dashboard

      - name: Package the dashboard Worker without uploading
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --config wrangler.dashboard.jsonc

  smoke:
    name: Dashboard smoke + a11y (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run hermetic smoke and axe specs
        run: npm run test:e2e:dashboard-smoke

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-smoke-traces
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  tier1:
    name: Dashboard Tier-1 on Anvil (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Tier-1 stub-wallet specs
        run: npm run test:e2e:dashboard-tier1

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-tier1-traces
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  tier2:
    name: Dashboard Tier-2 real MetaMask (Synpress)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Ensure xvfb for the headed browser
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi

      # Synpress downloads the pinned MetaMask 13.13.1 from GitHub releases on
      # first run and caches the wallet setup under ~/.cache/synpress.
      - name: Run Tier-2 MetaMask journey under xvfb
        run: xvfb-run -a npm run test:e2e:dashboard-tier2

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-tier2-traces
          # The stack handoff holds the test owner key: never upload it, even
          # though the key is public test material (e2e/harness.ts).
          path: |
            test-results/
            !test-results/tier2-stack.json
          if-no-files-found: warn
          retention-days: 14
