name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Foundry, SDK & E2E Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Show tool versions
        run: |
          forge --version
          node --version
          python3 --version

      - name: Run Forge fmt check
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge unit, fuzz, and invariant tests
        run: forge test -vvv

      - name: Simulate Sandbox deployment script (dry-run)
        env:
          PRIVATE_KEY: '1'
        run: forge script script/DeploySandbox.s.sol:DeploySandbox --chain-id 84532

      - name: Run TypeScript SDK unit tests
        run: npm run test:sdk-ts

      - name: Run Python SDK unit tests
        run: npm run test:sdk-py

      - name: Run E2E Scenarios S1-S6 & Threat Model T1-T10
        run: npm run test:e2e

  committed-files:
    name: Committed files hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify no local state, ignored, unexpected binary or oversized files in PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-committed-files.sh "${BASE_SHA}..HEAD"
